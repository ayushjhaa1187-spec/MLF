<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Atlas & Knowledge Graph - ML Foundations</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .concept-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            padding: 20px;
            transition: all 0.2s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .concept-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            border-color: #0284c7;
        }
        .concept-formula {
            background: #f8fafc;
            border-left: 3px solid #0284c7;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            margin: 12px 0;
            overflow-x: auto;
        }
        .filter-btn-group .btn.active {
            background-color: #0284c7;
            color: #fff;
            border-color: #0284c7;
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="home.html">
                <i class="fas fa-home me-2"></i> Course Dashboard
            </a>
            <span class="badge bg-primary px-3 py-2 fw-bold">Concept Atlas</span>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 1100px;">
        <div class="mb-4">
            <h1 class="display-6 fw-bold mb-2">Concept Atlas & Dependency Graph</h1>
            <p class="lead text-muted">
                Navigate the course through interconnected mathematical principles rather than isolated weeks. Trace prerequisites and discover how concepts connect across the curriculum.
            </p>
        </div>

        <!-- Pillar Filters -->
        <div class="d-flex flex-wrap gap-2 mb-4 filter-btn-group" id="pillarFilters">
            <button class="btn btn-outline-secondary btn-sm active" data-pillar="all">All Concepts</button>
            <button class="btn btn-outline-secondary btn-sm" data-pillar="linear-algebra"><i class="fas fa-vector-square me-1"></i> Linear Algebra</button>
            <button class="btn btn-outline-secondary btn-sm" data-pillar="multivariate-calculus"><i class="fas fa-square-root-variable me-1"></i> Calculus</button>
            <button class="btn btn-outline-secondary btn-sm" data-pillar="optimization"><i class="fas fa-mountain me-1"></i> Optimization</button>
            <button class="btn btn-outline-secondary btn-sm" data-pillar="probability"><i class="fas fa-dice me-1"></i> Probability</button>
        </div>

        <!-- Search Input -->
        <div class="mb-4">
            <input type="text" id="conceptSearch" class="form-control" placeholder="Search concept (e.g. projection, eigenvalues, gradient, SVD, Bayes)...">
        </div>

        <!-- Concepts Container -->
        <div class="row g-4" id="conceptsGrid">
            <!-- Populated dynamically from data/concepts.json -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="assets/js/progress-store.js"></script>
    <script src="assets/js/math-rendering.js"></script>

    <script>
        let allConcepts = [];
        let currentPillar = 'all';
        let searchQuery = '';
        const grid = document.getElementById('conceptsGrid');

        fetch('data/concepts.json')
            .then(res => res.json())
            .then(data => {
                allConcepts = data;
                renderConcepts();
            })
            .catch(err => console.error('Could not load concepts:', err));

        function renderConcepts() {
            if (!grid) return;
            const filtered = allConcepts.filter(c => {
                const matchPillar = (currentPillar === 'all' || c.pillar === currentPillar);
                const matchSearch = (!searchQuery || (c.name + ' ' + c.description).toLowerCase().includes(searchQuery));
                return matchPillar && matchSearch;
            });

            grid.innerHTML = filtered.map(c => `
                <div class="col-md-6 col-lg-4">
                    <div class="concept-card">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-primary">Week ${c.week}</span>
                            <span class="badge bg-light text-muted border text-capitalize">${c.pillar.replace('-', ' ')}</span>
                        </div>
                        <h5 class="fw-bold mb-2">${c.name}</h5>
                        <p class="text-muted small mb-2">${c.description}</p>
                        ${c.formula ? `<div class="concept-formula">$$${c.formula}$$</div>` : ''}
                        ${c.prerequisites && c.prerequisites.length > 0 ? `
                            <div class="small text-muted mb-3">
                                <strong>Prerequisites:</strong> ${c.prerequisites.join(', ')}
                            </div>
                        ` : ''}
                        <div class="mt-auto pt-2 border-top d-flex gap-2">
                            <a href="week-${c.week}/week-${c.week}.html" class="btn btn-sm btn-outline-primary flex-grow-1">
                                <i class="fas fa-book-open me-1"></i> Lesson
                            </a>
                            <a href="practice/solved_problems.html?week=${c.week}" class="btn btn-sm btn-outline-success">
                                <i class="fas fa-tasks me-1"></i> Practice
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');

            if (window.renderMLFMath) window.renderMLFMath(grid);
        }

        // Pillar filtering
        document.querySelectorAll('#pillarFilters button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#pillarFilters button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPillar = btn.getAttribute('data-pillar');
                renderConcepts();
            });
        });

        // Search input
        document.getElementById('conceptSearch').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderConcepts();
        });
    </script>
</body>
</html>
